<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Thumbnail YouTube Agi Mas</title>
<link rel="stylesheet" href="/web/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", sans-serif; position: relative; background: linear-gradient(135deg, #2b8cf0 0%, #1e7be6 40%, #0f4fa8 100%); color: #fff; }
  .roads { position: absolute; inset: 0; opacity: .1; background:
     linear-gradient(90deg, transparent 49.4%, #fff 49.4% 50.6%, transparent 50.6%) 0 0 / 160px 100%,
     linear-gradient(0deg, transparent 49.4%, #fff 49.4% 50.6%, transparent 50.6%) 0 0 / 100% 160px; }
  .glow { position: absolute; width: 700px; height: 700px; right: -120px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(255,216,77,.35), transparent 65%); }
  .left { position: absolute; left: 56px; top: 50px; width: 690px; }
  .logo { height: 62px; padding: 7px 16px; border-radius: 18px; background: #f7f7f7; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  h1 { margin-top: 26px; font-size: 86px; line-height: .98; font-weight: 800; letter-spacing: -.035em; text-shadow: 0 6px 0 rgba(8,40,90,.35); }
  h1 .y { color: #ffd84d; }
  .sub { margin-top: 26px; display: inline-block; padding: 12px 24px; border-radius: 18px; background: #0b2545; font-size: 40px; font-weight: 800; letter-spacing: -.01em; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  .sub b { color: #ffd84d; }
  .tags { position: absolute; left: 56px; bottom: 40px; display: flex; gap: 10px; flex-wrap: nowrap; }
  .tags span { padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35); font-size: 20px; font-weight: 800; white-space: nowrap; }
  .phone { position: absolute; width: 270px; height: 560px; border-radius: 42px; background: #0b1a2e; padding: 10px; box-shadow: 0 30px 60px rgba(5,25,60,.5), inset 0 0 0 2px #2a3a52; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 33px; display: block; }
  .p1 { left: 760px; top: 110px; transform: rotate(-8deg); }
  .p2 { left: 960px; top: 70px; transform: rotate(6deg); }
  .motor { position: absolute; left: 700px; top: 450px; width: 330px; filter: drop-shadow(0 18px 18px rgba(5,25,60,.45)); }
  .badge { position: absolute; right: 36px; bottom: 40px; padding: 14px 22px; border-radius: 20px; background: #ffd84d; color: #2b1f00; font-size: 34px; font-weight: 800; transform: rotate(-4deg); box-shadow: 0 10px 0 rgba(0,0,0,.18); }
</style>
</head>
<body>
<div class="roads"></div><div class="glow"></div>
<div class="left">
  <img class="logo" src="/web/logo.png" alt="">
  <h1>APLIKASI<br>OJEK <span class="y">ONLINE</span><br>BUATAN SENDIRI</h1>
  <p class="sub">Android + iPhone · <b>100% GRATIS</b></p>
</div>
<div class="tags"><span>HTML + JS</span><span>Capacitor</span><span>Firebase</span><span>OpenStreetMap</span></div>
<div class="phone p1"><img src="app-home.png" alt=""></div>
<div class="phone p2"><img src="app-form.png" alt=""></div>
<img class="motor" src="/web/splash-motor.png" alt="">
<div class="badge">Madiun 🛵</div>
</body>
</html>

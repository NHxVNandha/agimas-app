<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Tutorial</title>
<link rel="stylesheet" href="/app/fonts.css">
<style>
@font-face{font-family:Inter;src:url(/tfonts/Inter-latin-var.woff2) format("woff2");font-weight:100 900}
/* Agi Mas: latar PNG "Dua Warna" (promo/video-bg, dibuat tools/video_bg.py) sudah berisi logo; teks narasi di area putih. */
:root{--a:#1e7be6;--a2:#0b3d8c;--ink:#0b2545;--say:#34465c;--font:"Plus Jakarta Sans",system-ui,sans-serif}
body.kasir{--a:#1f6b45;--a2:#173f2e;--ink:#13201a;--say:#34463c;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;overflow:clip}
body{font-family:var(--font);color:var(--ink);background:#fff}
#stage{position:fixed;left:0;top:0;overflow:clip;background-size:cover}
body.kasir #stage{background:radial-gradient(1400px 900px at 20% 0%,#fff 0,#f1faf4 45%,#d5ecdd 100%)}
.panel{position:absolute;display:flex;flex-direction:column;gap:18px;z-index:3;pointer-events:none}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:26px}
.stepn{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:8px 16px;border-radius:99px;background:var(--a);color:#fff;font-weight:700;font-size:20px;letter-spacing:.03em}
.dots{display:flex;gap:7px;flex-wrap:wrap}.dots i{width:26px;height:6px;border-radius:9px;background:rgba(11,37,69,.12)}.dots i.on{background:var(--a)}.dots i.done{background:var(--a);opacity:.35}
.title{font-weight:800;letter-spacing:-.02em;line-height:1.1}
.say{color:var(--say);line-height:1.5;font-weight:500}
.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.in.d2{animation-delay:.1s}.in.d3{animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.dev{position:absolute;z-index:2;background:#0d1117;box-shadow:0 40px 90px -24px rgba(5,25,60,.55),0 0 0 2px rgba(255,255,255,.35) inset}
.dev iframe{border:0;display:block;background:#fff;transform-origin:0 0}
#cur{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.4);border:3px solid rgba(20,20,20,.75);
  box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none;z-index:50;transition:transform .55s cubic-bezier(.45,.05,.25,1);transform:translate(-200px,2200px)}
#cur.tap::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:4px solid var(--a);animation:rip .6s ease-out}
@keyframes rip{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
#card{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:0 60px;
  background:linear-gradient(180deg,#ffffff,#eef5ff);color:var(--ink);transition:opacity .6s;pointer-events:none}
body.kasir #card{background:linear-gradient(180deg,#ffffff,#e4f4ea)}
#card.off{opacity:0}
#card img{width:min(720px,80%);animation:rise .8s both}
#card .ic{width:150px;height:150px;border-radius:40px;background:var(--a2);display:grid;place-items:center;animation:rise .8s both}
#card .ic svg{width:84px;height:84px;stroke:#8fe0b0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#card .k{font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--a);animation:rise .8s .25s both}
#card h1{font-size:84px;margin:0;letter-spacing:-.03em;line-height:1.05;animation:rise .8s .4s both}
#card p{font-size:32px;margin:0;color:var(--say);max-width:1200px;line-height:1.4;animation:rise .8s .55s both}
[hidden]{display:none!important}
/* Kasir: teks di atas kartu putih agar tetap terbaca di atas bentuk-bentuk latar Geometris */
body.kasir .panel{background:rgba(255,255,255,.95);padding:22px 26px;border-radius:22px;box-shadow:0 14px 34px -18px rgba(23,63,46,.45)}
body.kasir.story .panel .say{background:rgba(255,255,255,.95);padding:22px 26px;border-radius:22px;box-shadow:0 14px 34px -18px rgba(23,63,46,.45);left:0;right:0}
#sync{position:fixed;left:0;top:0;width:8px;height:8px;background:#000;z-index:100}
.sen{transition:color .3s}.say.hl .sen{color:#9aa9bb}.say.hl .sen.on{color:var(--ink)}
.bar{position:absolute;left:0;bottom:0;height:8px;background:var(--a);transition:width .6s;width:0;z-index:5}
</style></head>
<body>
<div id="stage">
  <div class="panel" id="panel">
    <div class="brand" id="brand"></div>
    <div class="stepn" id="stepn" hidden></div>
    <div class="dots" id="dots"></div>
    <div class="title" id="title"></div>
    <div class="say" id="say"></div>
  </div>
  <div class="dev" id="dev"><iframe id="app"></iframe></div>
  <div id="card" class="off"></div>
  <div class="bar" id="bar"></div>
</div>
<div id="cur"></div>
<i id="sync"></i>
<script>
var q = new URLSearchParams(location.search), mode = q.get("mode"), story = q.get("fmt") === "story", $ = function (i) { return document.getElementById(i); };
var STORE = '<svg viewBox="0 0 24 24"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg>';
var VW = story ? 1080 : 1920, VH = story ? 1920 : 1080, s, W, H, pad = 14, X, Y, P = $("panel").style;
[document.documentElement, document.body, $("stage")].forEach(function (e) { e.style.width = VW + "px"; e.style.height = VH + "px"; });
if (mode === "kasir") {
  document.body.className = "kasir" + (story ? " story" : ""); W = 1280; H = 800;
  $("brand").innerHTML = '<span style="display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--a2);color:#8fe0b0">' + STORE.replace("<svg", '<svg width="30" height="30" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"') + "</span><span>Saget Kasir</span>";
  // latar PNG "Geometris datar" (promo/video-bg, dibuat tools/video_bg_kasir.py) sudah berisi logo Saget Kasir
  $("brand").hidden = true; $("stage").style.background = "url(/bg/kasir-3-geometris-" + (story ? "story" : "landscape") + ".png) 0 0 / cover";
  if (story) { s = 0.78; X = 27; Y = 590; Object.assign(P, { left: "70px", right: "70px", top: "300px", gap: "14px" }); $("title").style.fontSize = "48px"; $("say").style.cssText = "font-size:34px;position:absolute;left:0;right:0;top:" + (Y - 300 + H * s + 28 + 60) + "px"; }
  else { s = 1.0; X = 60; Y = (1080 - H * s - 28) / 2; Object.assign(P, { left: "1438px", right: "50px", top: "210px", gap: "16px" }); $("title").style.fontSize = "40px"; $("say").style.fontSize = "24px"; }
} else {
  W = 400; H = 860; $("brand").hidden = true;   // logo sudah ada di gambar latar
  $("stage").style.backgroundImage = "url(/bg/3-dua-warna-" + (story ? "story" : "landscape") + ".png)";
  if (story) { s = 1.15; X = 296; Y = 735; Object.assign(P, { left: "70px", right: "70px", top: "330px", gap: "14px" }); $("title").style.fontSize = "46px"; $("say").style.fontSize = "27px"; }
  else { s = 1.1; X = 1270; Y = (1080 - H * s - 28) / 2; Object.assign(P, { left: "140px", width: "620px", top: "380px" }); $("title").style.fontSize = "52px"; $("say").style.fontSize = "28px"; }
}
var fr = $("app"), R = mode === "kasir" ? 34 : 56; fr.width = W; fr.height = H; fr.style.transform = "scale(" + s + ")";
fr.style.marginBottom = -(H * s - H) + "px"; fr.style.marginRight = -(W * s - W) + "px"; fr.style.borderRadius = (R - 14) / s + "px";
Object.assign($("dev").style, { left: X + "px", top: Y + "px", padding: pad + "px", borderRadius: R + "px", width: W * s + pad * 2 + "px", height: H * s + pad * 2 + "px" });
window.cur = function (x, y) { $("cur").style.transform = "translate(" + x + "px," + y + "px)"; };
window.ripple = function () { var c = $("cur"); c.classList.remove("tap"); void c.offsetWidth; c.classList.add("tap"); };
window.step = function (a) {
  var c = $("card");
  if (a.card) {
    c.innerHTML = (mode === "kasir" ? '<div class="ic">' + STORE + "</div>" : '<img src="/bg/logo-agimas-full.png" alt="">') + '<div class="k">' + a.card.k + "</div><h1>" + a.card.h + "</h1><p>" + a.card.p + "</p>";
    c.classList.remove("off");
  } else c.classList.add("off");
  var real = a.n - 2, n = a.i > 0 && a.i <= real;
  $("stepn").hidden = !n; $("stepn").innerHTML = n ? '<span class="in">Langkah ' + a.i + " dari " + real + "</span>" : "";
  $("dots").innerHTML = Array.from({ length: real }, function (_, k) { return '<i class="' + (k + 1 === a.i ? "on" : k + 1 < a.i ? "done" : "") + '"></i>'; }).join("");
  $("title").innerHTML = '<span class="in d2" style="display:block">' + a.title + "</span>";
  $("say").innerHTML = '<span class="in d3" style="display:block">' + a.says.map(function (t) { return '<span class="sen">' + t + "</span>"; }).join(" ") + "</span>";
  $("say").classList.toggle("hl", a.says.length > 1);
  $("bar").style.width = (100 * (a.i + 1) / a.n) + "%";
};
window.loadApp = function (u) { fr.src = u; };
// penanda sinkron (berganti hitam/putih tiap kalimat) + sorot kalimat yang sedang dibacakan
window.sync = function (k, j) {
  $("sync").style.background = k % 2 ? "#000" : "#fff";
  Array.prototype.forEach.call(document.querySelectorAll("#say .sen"), function (e, i) { e.classList.toggle("on", i === j); });
};
</script>
</body></html>
